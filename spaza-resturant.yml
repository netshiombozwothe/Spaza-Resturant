apiVersion: '2021-03-01'
location: centralindia
name: <aci-container-group-name>
type: Microsoft.ContainerInstance/containerGroups
properties:
  osType: Linux

  # -------------------------------------------------------------
  # IMAGE REGISTRY CREDENTIALS (Moved inside properties)
  # -------------------------------------------------------------
  imageRegistryCredentials:
    - server: <acr login server name>
      username: <username>
      password: <password>

  # -------------------------------------------------------------
  # PUBLIC IP (Frontend only)
  # -------------------------------------------------------------
  ipAddress:
    type: Public
    ports:
      - protocol: tcp
        port: 80

  # -------------------------------------------------------------
  # CONTAINERS (Frontend, Backend, MySQL)
  # -------------------------------------------------------------
  containers:

    # ===== FRONTEND =====
    - name: <container name>
      properties:
        image: <acr login server>/<container:tag>
        ports:
          - port: 80
        resources:
          requests:
            cpu: 1.0
            memoryInGb: 1.5
        environmentVariables:
          - name: BACKEND_URL
            value: "http://localhost:8000"

    # ===== BACKEND =====
    - name: <container name>
      properties:
        image: <acr login server>/<container:tag>
        ports:
          - port: 8000
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        environmentVariables:
          - name: DB_HOST
            value: "localhost"
          - name: DB_USER
            value: "aci_user"
          - name: DB_PASSWORD
            value: "Reset@123"
          - name: DB_NAME
            value: "aci_demo_db"

    # ===== MYSQL =====
    - name: mysql
      properties:
        image: mysql:8.0
        ports:
          - port: 3306
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        environmentVariables:
          - name: MYSQL_ROOT_PASSWORD
            value: "rootpassword"
          - name: MYSQL_DATABASE
            value: "aci_demo_db"
          - name: MYSQL_USER
            value: "aci_user"
          - name: MYSQL_PASSWORD
            value: "Reset@123"
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql

  # -------------------------------------------------------------
  # STORAGE VOLUME (Azure File Share)
  # -------------------------------------------------------------
  volumes:
    - name: mysql-data
      azureFile:
        sharename: <file share name>
        storageAccountName: <storage account name>
        storageAccountKey: <storageAccountKey>